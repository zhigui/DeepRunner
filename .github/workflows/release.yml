name: Signed release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: node scripts/check-release-version.mjs
      - run: yarn check

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      DEEPRUNNER_APPLE_API_KEY_B64: ${{ secrets.DEEPRUNNER_APPLE_API_KEY_B64 }}
      CSC_LINK: ${{ secrets.DEEPRUNNER_MAC_CERT_P12_B64 }}
      CSC_KEY_PASSWORD: ${{ secrets.DEEPRUNNER_MAC_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ github.workspace }}/.release-secrets/AuthKey.p8
      APPLE_API_KEY_ID: ${{ secrets.DEEPRUNNER_APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.DEEPRUNNER_APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.DEEPRUNNER_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: node scripts/prepare-apple-api-key.mjs
      - run: yarn build
      - run: yarn workspace @deeprunner/desktop release:package --mac --${{ matrix.arch }}
      - name: Preserve architecture-specific update metadata
        shell: bash
        run: mv apps/desktop/release/latest-mac.yml apps/desktop/release/latest-mac-${{ matrix.arch }}.yml
      - name: Verify Gatekeeper and notarization ticket
        shell: bash
        run: |
          app_path=$(find apps/desktop/release -type d -name DeepRunner.app -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac-*.yml
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-2022
    env:
      CSC_LINK: ${{ secrets.DEEPRUNNER_WINDOWS_CERT_PFX_B64 }}
      CSC_KEY_PASSWORD: ${{ secrets.DEEPRUNNER_WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn workspace @deeprunner/desktop release:package --win --x64
      - name: Verify Authenticode
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.StatusMessage)" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn workspace @deeprunner/desktop release:package --linux --x64
      - run: dpkg-deb --info apps/desktop/release/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: yarn install --immutable
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - run: node scripts/merge-mac-update-metadata.mjs
      - run: node scripts/generate-sbom.mjs
      - run: node scripts/verify-update-metadata.mjs
      - name: Create draft release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            test "$(gh release view "v$version" --json isDraft --jq .isDraft)" = true
            gh release upload "v$version" release-artifacts/* --clobber
          else
            gh release create "v$version" release-artifacts/* --draft --verify-tag --title "DeepRunner v$version" --generate-notes
          fi
      - name: Download published bytes and verify again
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir downloaded-release
          gh release download "v$version" --dir downloaded-release
          DEEPRUNNER_RELEASE_ARTIFACTS_DIR="$PWD/downloaded-release" node scripts/verify-update-metadata.mjs
          gh release edit "v$version" --draft=false --latest
